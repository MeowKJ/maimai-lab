name: CI-CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-contract:
    name: Env Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate env templates
        run: python apps/bot/scripts/env_contract.py

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: env-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/bot/requirements.txt

      - name: Inject env vars from Doppler
        if: ${{ secrets.DOPPLER_TOKEN != '' }}
        uses: dopplerhq/secrets-fetch-action@v1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Run Python tests
        run: cd apps/bot && python -m pytest -q

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: env-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Inject env vars from Doppler
        if: ${{ secrets.DOPPLER_TOKEN != '' }}
        uses: dopplerhq/secrets-fetch-action@v1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          inject-env-vars: true

      - name: Build web app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @maimai-bot-plus/web build

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - web-build
    if: ${{ github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build deployment artifact (preview)
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - web-build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployment artifact (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-bot-ubuntu:
    name: Deploy QQ Bot (Ubuntu)
    runs-on: ubuntu-latest
    environment: bot-production
    needs:
      - python-tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      BOT_SSH_HOST: ${{ secrets.BOT_SSH_HOST }}
      BOT_SSH_USER: ${{ secrets.BOT_SSH_USER }}
      BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
      BOT_SSH_PORT: ${{ secrets.BOT_SSH_PORT }}
      BOT_DEPLOY_PATH: ${{ secrets.BOT_DEPLOY_PATH }}
      BOT_SYSTEMD_SERVICE: ${{ secrets.BOT_SYSTEMD_SERVICE }}
      MAIMAI_BOT_APPID: ${{ secrets.MAIMAI_BOT_APPID }}
      MAIMAI_BOT_SECRET: ${{ secrets.MAIMAI_BOT_SECRET }}
      MAIMAI_LXNS_API_SECRET: ${{ secrets.MAIMAI_LXNS_API_SECRET }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.BOT_SSH_HOST }}
          username: ${{ env.BOT_SSH_USER }}
          key: ${{ env.BOT_SSH_KEY }}
          port: ${{ env.BOT_SSH_PORT }}
          envs: BOT_DEPLOY_PATH,BOT_SYSTEMD_SERVICE,MAIMAI_BOT_APPID,MAIMAI_BOT_SECRET,MAIMAI_LXNS_API_SECRET
          script_stop: true
          script: |
            set -e
            test -n "$MAIMAI_BOT_APPID"
            test -n "$MAIMAI_BOT_SECRET"
            test -n "$MAIMAI_LXNS_API_SECRET"

            sudo install -d -m 750 -o root -g maimai /etc/maimai-bot
            umask 077
            {
              printf 'MAIMAI_DEBUG=false\n'
              printf 'MAIMAI_BOT_APPID=%s\n' "$MAIMAI_BOT_APPID"
              printf 'MAIMAI_BOT_SECRET=%s\n' "$MAIMAI_BOT_SECRET"
              printf 'MAIMAI_LXNS_API_SECRET=%s\n' "$MAIMAI_LXNS_API_SECRET"
              printf 'MAIMAI_BOT_VERSION=3.0-modern\n'
              printf 'MAIMAI_ASSETS_URL=https://assets.lxns.net\n'
              printf 'MAIMAI_IMAGE_SERVER_URL=http://127.0.0.1:5000\n'
              printf 'MAIMAI_DEFAULT_AVATAR_URL=https://q1.qlogo.cn/g?b=qq&nk=0&s=640\n'
              printf 'MAIMAI_DATABASE_PATH=/opt/maimai-lab/apps/bot/data/bot.db\n'
              printf 'MAIMAI_TEMP_DIR=/opt/maimai-lab/apps/bot/tmp\n'
            } | sudo tee /etc/maimai-bot/production.env > /dev/null
            sudo chown root:maimai /etc/maimai-bot/production.env
            sudo chmod 640 /etc/maimai-bot/production.env

            cd "$BOT_DEPLOY_PATH"
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            sudo install -m 644 apps/bot/deploy/maimai-bot.service /etc/systemd/system/maimai-bot.service
            sudo systemctl daemon-reload

            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r apps/bot/requirements.txt

            sudo systemctl restart "$BOT_SYSTEMD_SERVICE"
            sudo systemctl --no-pager --full status "$BOT_SYSTEMD_SERVICE" | sed -n '1,30p'
